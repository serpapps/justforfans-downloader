<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JustForFans Bulk Saver</title>
    <style>
      body { font-family: "Trebuchet MS", "Gill Sans", "Century Gothic", sans-serif; background: #050505; color: #e7e9ea; margin: 0; padding: 16px; }
      .card { background: #0d0d0d; border: 1px solid #1f252b; border-radius: 12px; padding: 16px; max-width: 560px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 6px 0; color: #8b98a5; }
      button { background: #1a8cd8; border: none; color: #f7fbff; font-weight: 700; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
      button:hover { filter: brightness(1.05); }
      .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
      .status { margin-top: 10px; font-size: 12px; color: #8b98a5; }
      .ok { color: #2ecc71; }
      .warn { color: #ffd166; }
      .err { color: #ff5c5c; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bulk Saver</h1>
      <p>Choose a folder once. JustForFans playlist bulk downloads will save there without extra prompts.</p>
      <div class="row">
        <button id="chooseBtn">Choose Folder...</button>
        <span id="dirStatus" class="status">No folder selected</span>
      </div>
      <p id="hint" class="status">Keep this window open while playlist bulk downloads run.</p>
      <div id="saveLog" class="status"></div>
    </div>
    <script type="module" src="bulk-saver.js"></script>
  </body>
  </html>
