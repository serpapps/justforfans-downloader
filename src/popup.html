<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SERP JustForFans Downloader</title>
    <style id="serp-auth-boot-css">
      #activationSection { display: none !important; }
      body[data-auth-screen="visible"] #activationSection[data-serp-auth-ui="1"] { display: block !important; }
    </style>
    <script src="site-config.js"></script>
    <link rel="stylesheet" href="styles/popup-enhanced.css" />
  </head>
  <body>
    <div class="bg-orbit bg-orbit-a"></div>
    <div class="bg-orbit bg-orbit-b"></div>

    <div class="popup-shell">
      <div id="bootSplash" class="boot-splash">Loading JustForFans Downloader...</div>

      <header class="header">
        <div class="header-copy">
          <h1>JustForFans Downloader</h1>
          <p class="subtitle">Save visible videos, images, and text.</p>
        </div>
        <div class="header-actions">
          <details class="help-disclosure">
            <summary class="help-toggle" title="Download help" aria-label="Download help">?</summary>
            <div class="help-content">
              <strong>Having trouble downloading a video?</strong>
              <p>Open the playlist on your profile first, then download the videos from there.</p>
            </div>
          </details>
          <button id="refreshBtn" class="ghost-btn" type="button">Rescan</button>
        </div>
      </header>

      <div id="trialBanner" class="trial-banner hidden"></div>

      <section id="activationSection" class="activation-section"></section>

      <main id="mainContent" class="main-content hidden">
        <section class="stats-grid">
          <div class="stat-card">
            <span class="stat-label">Videos</span>
            <strong id="videoCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Images</span>
            <strong id="imageCount">0</strong>
          </div>
          <div class="stat-card">
            <span class="stat-label">Text Posts</span>
            <strong id="textCount">0</strong>
          </div>
        </section>

        <section class="tabs">
          <button class="tab-btn active" data-tab="videos" type="button">Videos</button>
          <button class="tab-btn" data-tab="images" type="button">Images</button>
          <button class="tab-btn" data-tab="texts" type="button">Text</button>
          <button class="tab-btn" data-tab="bulk" type="button">Bulk</button>
        </section>

        <section class="panel-actions">
          <button id="downloadAllBtn" class="primary-btn" type="button">Download Visible</button>
          <button id="bulkQuickStartBtn" class="ghost-btn" type="button">Bulk Tools</button>
        </section>

        <section id="assetList" class="asset-list"></section>
      </main>

      <footer id="status" class="status info">Checking activation status...</footer>
    </div>

    <script src="logger.js"></script>
    <script type="module" src="auth.js"></script>
    <script defer src="popup-enhanced.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="trial-banner.js"></script>
    <script defer src="update-notifier.js"></script>
  </body>
</html>
